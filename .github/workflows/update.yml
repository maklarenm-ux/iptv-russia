
name: Update IPTV playlist

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# Не запускаем две сборки одновременно: иначе они могут одновременно
# попытаться записать playlist.m3u в main.
concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build.py

      - name: Commit playlist
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"
          git add playlist.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Automatic IPTV update"
            # Подтягиваем изменения, появившиеся после checkout,
            # чтобы push не завершался ошибкой fetch first.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
